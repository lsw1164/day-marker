<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day Marker</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Runs before first paint. Doing this in React would show a flash of the
      // wrong theme on every load. One mechanism (the class), two sources: a
      // stored choice if there is one, the OS otherwise.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('dayMarker.theme')
        } catch (e) {
          // Private browsing can throw. Leaving `stored` null hands the decision to
          // the OS, which is exactly what useTheme's own catch does by returning
          // 'system'. If the two disagreed, this script would paint one theme and
          // React would swap it on mount -- the flash this script exists to prevent.
        }
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
